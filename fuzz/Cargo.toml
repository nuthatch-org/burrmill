[package]
name = "burrmill-ingest-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Both readers on, so the csv target, which sniffs, reaches them.
burrmill-ingest = { path = "../crates/burrmill-ingest", features = ["json", "parquet"] }
burrmill = { path = "../crates/burrmill", features = ["datafusion"] }

# Own workspace, so `cargo test` at the repo root does not build it and a resolve here
# cannot move the engine's lock. Its own lock follows the engine's by hand: when a pin in
# crates/burrmill moves, `cp Cargo.lock fuzz/ && cargo metadata --manifest-path fuzz/Cargo.toml`.
# The fmt job in ci.yml refuses a pull request that leaves it behind.
[workspace]

[[bin]]
name = "csv"
path = "fuzz_targets/csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sql"
path = "fuzz_targets/sql.rs"
test = false
doc = false
bench = false
