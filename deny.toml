# `cargo deny check`, run in CI.

[graph]
all-features = true

[advisories]
ignore = [
    # zip 6 and rkyv 0.7 come only from libduckdb-sys, the bench's oracle; zip unpacks DuckDB's
    # own bundled source at build time and rkyv is in no build graph. Both need majors upstream.
    { id = "RUSTSEC-2026-0367", reason = "bench-only, libduckdb-sys build script" },
    { id = "RUSTSEC-2026-0368", reason = "bench-only, libduckdb-sys build script" },
    { id = "RUSTSEC-2026-0369", reason = "bench-only, libduckdb-sys build script" },
    { id = "RUSTSEC-2026-0429", reason = "bench-only, libduckdb-sys build script" },
    { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7 is in no build graph" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Two Arrows (the bench's DuckDB pins 58) and several hashbrowns are known; see #170.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace's own unpublished crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
