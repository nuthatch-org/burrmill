name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The commands the jobs run live in yatr.toml. Bump deliberately.
  YATR_VERSION: "1.5.0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked --force
        env:
          RUSTFLAGS: ""
      - run: yatr fmt-check
      # fuzz/ has its own lock and only the nightly job builds it: a pin bumped here that the
      # lock there does not follow would otherwise first fail at night.
      - name: fuzz lock resolves
        run: yatr fuzz-lock
      # The table is generated from yatr.toml; `yatr agents --write` refreshes it.
      - name: AGENTS.md task table is current
        run: yatr agents-check

  # The library both ways: the default graph is pure Rust and must build on its own, and
  # `datafusion` is what nuthatch embeds.
  burrmill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: burrmill
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked --force
        env:
          RUSTFLAGS: ""
      - name: clippy (default and datafusion)
        run: yatr lint
      # Includes generated_planner, which rustfmts its output to compare it with the committed file.
      - name: test (default and datafusion)
        run: yatr test
      - name: the burrmill binary
        run: yatr cli

  # Lint only: the bench has no tests, and its own job keeps the bundled DuckDB build off the
  # library's critical path.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: bench
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked --force
        env:
          RUSTFLAGS: ""
      - name: clippy
        run: yatr bench-lint

  # #386: DuckDB's own test/sql at the tag in docs/bench/sqllogictest.sh, fetched as data, run
  # against the engine and held to docs/bench/sqllogictest-baseline.tsv: the job fails if any
  # directory's wrong answers rise or its passes fall, and says how to lock in an improvement.
  sqllogictest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sqllogictest
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked --force
        env:
          RUSTFLAGS: ""
      - name: DuckDB's test/sql against the baseline
        run: yatr sqllogictest
      # file, line, class and detail for every record, to see what moved.
      - name: records
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqllogictest-records
          path: target/sqllogictest/records.tsv
          if-no-files-found: ignore

  # Advisories, licences, duplicate versions and sources, from deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # The browser tab's reader (docs/browser.md) builds for wasm32 and its graph has no C.
  ingest-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ingest-wasm
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked --force
        env:
          RUSTFLAGS: ""
      - name: test and clippy
        run: yatr ingest
      - name: wasm graph and gzip size
        run: yatr ingest-size

  # The tab: the code that decides what leaves it, and the engine it downloads.
  tab-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: tab-wasm
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked --force
        env:
          RUSTFLAGS: ""
      - name: test and clippy
        run: yatr tab
      # Warnings refuse (RUSTFLAGS in yatr.toml): what only wasm32 leaves unused is seen by no
      # clippy step above.
      - name: build for wasm32
        run: yatr tab-build
      # The demo downloads ingest and the engine as one module.
      - name: engine gzip under 8 MiB
        run: yatr engine-size

  # #343: a static binary, since zstd-sys is the only C in the graph.
  cli-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: cli-musl
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked --force
        env:
          RUSTFLAGS: ""
      - run: sudo apt-get install -y musl-tools
      - run: yatr cli-musl

  # The page's claim, that the cells stay in the tab, is tested only in a browser: every
  # demo/*.mjs against the built engine on a static server.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: demo
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The CLI must match the crate's pin, so the pin is read rather than repeated.
      - id: pin
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/burrmill-wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - id: bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/wasm-bindgen
          key: wasm-bindgen-${{ steps.pin.outputs.version }}-${{ runner.os }}
      - name: install wasm-bindgen
        if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.pin.outputs.version }}" --locked --root ~/wasm-bindgen
      - run: echo "$HOME/wasm-bindgen/bin" >> "$GITHUB_PATH"
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked --force
        env:
          RUSTFLAGS: ""
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: engine and browser tests
        run: yatr demo-test
