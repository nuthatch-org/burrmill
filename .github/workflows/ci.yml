name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The library both ways: the default graph is pure Rust and must build on its own, and
  # `datafusion` is what nuthatch embeds.
  burrmill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: burrmill
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy (default)
        run: cargo clippy --locked -p burrmill --all-targets -- -D warnings
      - name: clippy (datafusion)
        run: cargo clippy --locked -p burrmill --all-targets --features datafusion -- -D warnings
      - name: test (default)
        run: cargo test --locked -p burrmill
      # Includes generated_planner, which rustfmts its output to compare it with the committed file.
      - name: test (datafusion)
        run: cargo test --locked -p burrmill --features datafusion

  # Lint only: the bench has no tests, and its own job keeps the bundled DuckDB build off the
  # library's critical path.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: bench
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy
        run: cargo clippy --locked -p burrmill-bench --all-targets --all-features -- -D warnings

  # Advisories, licences, duplicate versions and sources, from deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # RFC-0047 slice 2. The reader builds for wasm32 and its graph has no C.
  ingest-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ingest-wasm
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test and clippy
        run: |
          cargo clippy --locked -p burrmill-ingest --all-targets -- -D warnings
          cargo test --locked -p burrmill-ingest
      - name: wasm graph and gzip size
        run: docs/bench/ingest-wasm.sh

  # The tab: the code that decides what leaves it, and the engine it downloads.
  tab-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: tab-wasm
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test and clippy
        run: |
          cargo clippy --locked -p burrmill-wasm --all-targets -- -D warnings
          cargo test --locked -p burrmill-wasm
      - name: build for wasm32
        run: cargo build --locked -p burrmill-wasm --target wasm32-unknown-unknown
      # The demo downloads ingest and the engine as one module.
      - name: engine gzip under 8 MiB
        run: |
          cargo build -p burrmill-size --locked --target wasm32-unknown-unknown \
            --features engine --bin ingest-engine --profile wasm-size
          gz=$(gzip -9 -c target/wasm32-unknown-unknown/wasm-size/ingest-engine.wasm | wc -c)
          echo "ingest-engine.wasm gzip -9: $gz"
          test "$gz" -le 8388608
