name: fuzz

# cargo-fuzz needs nightly and each target runs for a fixed time, so this is a schedule, not a
# pull request check.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with ci.yml.
  YATR_VERSION: "1.4.0"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: csv
          - target: sql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}
          cache-on-failure: true
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - name: install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2
      # Every target builds in each job, so one that stops compiling fails all of them.
      - name: build
        run: yatr fuzz-build
      - name: run
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        run: yatr fuzz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/

  # The generated-fold oracle at more cases than `cargo test` runs (ROADMAP 2.1).
  generated-folds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: generated-folds
          cache-on-failure: true
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - name: 3,000 cases
        run: yatr generated-folds
