name: fuzz

# cargo-fuzz needs nightly and each target runs for a fixed time, so this is a schedule, not a
# pull request check.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: csv
            seeds: corpus/ingest
          - target: sql
            seeds: fuzz/seeds/sql
            args: -dict=fuzz/sql.dict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}
          cache-on-failure: true
      - name: install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2
      # Every target builds in each job, so one that stops compiling fails all of them.
      - name: build
        run: cargo +nightly fuzz build
      - name: run
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        # From no input, mutation rarely reaches a statement the dialect rewrites; the seeds do.
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} ${{ matrix.seeds }} -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=30 -rss_limit_mb=4096 ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/

  # The generated-fold oracle at more cases than `cargo test` runs (ROADMAP 2.1).
  generated-folds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: generated-folds
          cache-on-failure: true
      - name: 3,000 cases
        env:
          BURRMILL_CASES: "3000"
        run: cargo test --locked --release -p burrmill --test generated_folds
