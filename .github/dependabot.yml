version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      arrow:
        patterns: ["arrow*", "parquet"]
      datafusion:
        patterns: ["datafusion*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
