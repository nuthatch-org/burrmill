# Burrmill: a query engine-layer for sealed Parquet segments plus a live tip.
#
# `burrmill`'s default graph is pure Rust - no DuckDB, no DataFusion, no C++. DataFusion enters
# only behind the optional `datafusion` feature (roadmap 6.0 route C). `burrmill-bench` is where
# the oracles live, and it is `publish = false` precisely so that the incumbent engines we are
# measuring against can never reach the release graph. RFC-0042 §3a's binary rule, expressed as a
# workspace layout rather than as a promise.
#
# `burrmill-ingest` is RFC-0047 slice 1. It never depends on the engine, so nuthatch can take the
# reader without taking the query layer. `burrmill-wasm` is the JS package for the
# page: ingest, the engine, and the checks on an answer. It does no network. `burrmill-size` only
# links the two so the wasm gzip can be measured; it is not the JS package. `fuzz/` is its own
# workspace (cargo-fuzz).
[workspace]
resolver = "2"
members = [
    "crates/burrmill",
    "crates/burrmill-bench",
    "crates/burrmill-ingest",
    "crates/burrmill-size",
    "crates/burrmill-wasm",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuthatch-org/burrmill"

[workspace.dependencies]
# 59.x, matching DataFusion 55's Arrow. df-gate deliberately carried two Arrows (nuthatch's 58 for
# the fixture writer, DataFusion's 59 for reading results) because it lived inside nuthatch's graph.
# Burrmill does not, so it can hold one - and a sealed segment is a Parquet file, not an Arrow
# version, so reading what nuthatch writes with 58 is unaffected.
# No default features: csv, json and ipc are not the fold path, and arrow-json drags ahash onto wasm
# (investigation 05). A member that needs one names it.
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
rustc-hash = "2"
# The SwissTable the RFC names. Raw-entry access is what lets keys live in an arena instead of one
# heap allocation each, which is the difference between owning an aggregation and renting std's.
hashbrown = "0.16"
rayon = "1"
sqlparser = "0.62"

# Gzip size of the ingest reader. Selected by hand. Does not change `release`.
[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
