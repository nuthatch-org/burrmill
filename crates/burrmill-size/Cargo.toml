[package]
name = "burrmill-size"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "RFC-0047 size probe. Links ingest with the operator, and with the engine. Not a JS API."

[dependencies]
burrmill = { path = "../burrmill" }
burrmill-ingest = { path = "../burrmill-ingest" }
serde_json = { version = "1", optional = true }

# datafusion-common turns on arrow-ipc's zstd. The default zstd-sys build then
# compiles huf_decompress_amd64.S, which is not a wasm32 object. `no_asm` keeps
# the C decoder. The crate is still C, and the tree check still fails on it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
zstd-sys = { version = "=2.0.16", optional = true, default-features = false, features = ["no_asm"] }

[features]
# Off by default, so a workspace test does not build the probes.
link-wasm = []
# The full Engine. Off for the operator measurement, or the two graphs unify.
engine = ["link-wasm", "burrmill/datafusion", "dep:serde_json", "dep:zstd-sys"]

[[bin]]
name = "ingest-operator"
path = "src/bin/ingest-operator.rs"
required-features = ["link-wasm"]

[[bin]]
name = "engine-wasm"
path = "src/bin/engine-wasm.rs"
required-features = ["engine"]

[[bin]]
name = "ingest-engine"
path = "src/bin/ingest-engine.rs"
required-features = ["engine"]
