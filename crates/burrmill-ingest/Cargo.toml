[package]
name = "burrmill-ingest"
version = "0.0.1"
description = "Turn untrusted CSV into Arrow under hard budgets. See docs/browser.md."
keywords = ["csv", "arrow", "ingest"]
categories = ["parser-implementations"]
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# No default features on Arrow: csv/json/ipc are not this path, and arrow's defaults have
# dragged ahash onto wasm before (investigation 05).
[dependencies]
arrow = { workspace = true }
bytes = "1"
# The engine's own Parquet, Snappy only. Optional, so the CSV-only reader stays small.
parquet = { workspace = true, optional = true }
# The engine's own serde_json, for its syntax only. `raw_value` hands back a value's text.
serde = { version = "1", default-features = false, features = ["std"], optional = true }
serde_json = { version = "1", features = ["raw_value"], optional = true }

# Feature unification only. Not called. See `lib.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[features]
# Links the reader into a .wasm so the gzip size is of the code a tab would download.
# Off by default: native `cargo test` does not build the bin.
link-wasm = []
# Opens Parquet (#147). The tab and the size probe turn it on.
parquet = ["dep:parquet"]
# Opens JSON (#253). On for the tab and the size probe, as `parquet` is.
json = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "ingest-wasm"
path = "src/bin/ingest-wasm.rs"
required-features = ["link-wasm"]

[dev-dependencies]
arrow = { workspace = true }
# The fixtures' writer; lz4 only to write a codec the reader refuses.
parquet = { workspace = true, features = ["lz4"] }

[[test]]
name = "parquet"
required-features = ["parquet"]

[[test]]
name = "json"
required-features = ["json"]

[[test]]
name = "parquet_pages"
required-features = ["parquet"]
