[package]
name = "burrmill-cli"
version = "0.0.1"
description = "burrmill q: strict, deterministic and receipted SQL over Parquet files."
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "burrmill"
path = "src/main.rs"

[dependencies]
burrmill = { path = "../burrmill", features = ["datafusion"] }
arrow = { workspace = true, features = ["csv", "json", "ipc"] }
parquet.workspace = true
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
ctrlc = "3.5"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

